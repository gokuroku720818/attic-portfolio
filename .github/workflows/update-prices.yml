name: 공개 시세 자동 수집
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scrape_real_prices.cjs', '.github/workflows/update-prices.yml']
permissions:
  contents: write
concurrency:
  group: attic-price-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scrape_real_prices.cjs
      - name: 공개 시세 파일만 저장
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/prices.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: 최신 공개 시세 수집'
            git pull --rebase origin main
            git push origin main
          fi
